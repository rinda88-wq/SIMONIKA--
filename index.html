.lcard{width:100%;max-width:440px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:36px 32px;color:#e5e7eb;backdrop-filter:blur(8px)}
.logos{display:flex;gap:14px;justify-content:center;align-items:center;margin-bottom:18px}
.appicon{width:64px;height:64px;border-radius:16px;background:var(--ac);display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 0 30px rgba(91,75,232,.5)}
.prov{width:64px;height:64px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:34px}
.lcard h1{text-align:center;margin:0;font-size:30px;letter-spacing:.5px;color:#fff}
.lcard .sub{text-align:center;font-size:13px;color:#c7cbe0;margin:8px 0 22px;line-height:1.5}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;font:inherit;font-size:14px;border:1px solid var(--bd);background:#fff;color:var(--tx)}
.lcard input,.lcard select{background:#1a1f38;color:#fff;border-color:rgba(255,255,255,.15)}
textarea{resize:vertical;min-height:70px}
.btn{width:100%;margin-top:22px;padding:13px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.btn:hover{background:var(--ac2)}
.btn.sm{width:auto;margin:0;padding:8px 14px;font-size:13px}
.btn.ghost{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.err{color:#fca5a5;font-size:13px;margin-top:10px;text-align:center;min-height:18px}
.hint{font-size:12px;color:#9ca3af;text-align:center;margin-top:12px}
/* APP LAYOUT */
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:10px 20px}
.brand{font-weight:800;color:var(--ac);font-size:18px}
.brand small{display:block;font-weight:500;color:var(--mut);font-size:11px}
.hright{margin-left:auto;text-align:right;font-size:13px}
.badge{display:inline-block;background:#ede9fe;color:var(--ac2);font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;margin-top:2px}
.layout{display:flex;min-height:calc(100vh - 60px)}
nav{width:250px;background:#fff;border-right:1px solid var(--bd);padding:16px 12px;flex-shrink:0}
.uinfo{background:var(--bg);border-radius:12px;padding:12px;margin-bottom:14px;font-size:13px}
.uinfo b{display:block}
.navlbl{font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.8px;margin:14px 8px 6px}
.nav a{display:block;padding:9px 12px;border-radius:8px;color:var(--tx);text-decoration:none;font-size:14px;cursor:pointer;margin-bottom:2px}
.nav a:hover{background:var(--bg)}
.nav a.on{background:#eef0ff;color:var(--ac2);font-weight:600}
.nav a.sub{padding-left:28px;font-size:13px;color:var(--mut)}
main{flex:1;padding:24px;min-width:0}
.hero{background:linear-gradient(120deg,#7c3aed,#5b4be8);color:#fff;border-radius:16px;padding:22px 24px;margin-bottom:20px}
.hero h2{margin:6px 0 4px;font-size:22px}
.hero p{margin:0;font-size:13px;opacity:.9}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:18px}
.card h3{margin:0 0 4px;font-size:16px}
.card .d{font-size:13px;color:var(--mut);margin:0 0 14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.stat .n{font-size:26px;font-weight:800}
.stat .l{font-size:13px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
th{color:var(--mut);font-weight:600;background:#fafafa}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600}
.p-ok{background:#dcfce7;color:var(--ok)}
.p-warn{background:#fef3c7;color:var(--warn)}
.p-no{background:#f3f4f6;color:var(--no)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2 .full{grid-column:1/-1}
.sec{font-size:13px;font-weight:700;color:var(--ac2);margin:18px 0 0;border-top:1px dashed var(--bd);padding-top:14px}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.area{border:1px solid var(--bd);border-radius:10px;padding:12px;font-size:14px;cursor:pointer;background:#fff}
.area:hover{border-color:var(--ac)}
.area small{display:block;color:var(--mut);font-size:12px;margin-top:3px}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.empty{color:var(--mut);font-size:13px;padding:14px 0}
.toast{position:fixed;bottom:20px;right:20px;background:#111827;color:#fff;padding:12px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.bar{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--ac)}
@media(max-width:800px){.layout{flex-direction:column}nav{width:auto}.grid2{grid-template-columns:1fr}.hright{display:none}}
table.pf{border-collapse:collapse;width:100%;font-size:12px;margin-bottom:10px}
table.pf th,table.pf td{border:1px solid #d1d5db;padding:5px;text-align:left;vertical-align:top}
table.pf th{background:#f3f4f6}
.sec-t{margin:16px 0 6px;font-size:14px;color:#1f2937;border-left:4px solid #5b4be8;padding-left:8px}
@media print{
  body *{visibility:hidden}
  #pf_doc,#pf_doc *{visibility:visible}
  #pf_doc{position:absolute;left:0;top:0;width:100%}
  #pf_doc .card{border:none;box-shadow:none;padding:0}
  tr{page-break-inside:avoid}
  @page{size:A4 landscape;margin:12mm}
}
@media print{ body *{visibility:hidden} #lap_doc,#lap_doc *{visibility:visible} #lap_doc{position:absolute;left:0;top:0;width:100%} #lap_doc .card{border:none;box-shadow:none;padding:0} }
@media print{ body *{visibility:hidden} #mon_doc,#mon_doc *{visibility:visible} #mon_doc{position:absolute;left:0;top:0;width:100%} #mon_doc .card{border:none;box-shadow:none;padding:0} }
@media print{ body *{visibility:hidden} #sek_doc,#sek_doc *{visibility:visible} #sek_doc{position:absolute;left:0;top:0;width:100%} #sek_doc .card{border:none;box-shadow:none;padding:0} }
#tl_doc{display:none}
@media print{ body *{visibility:hidden} #tl_doc,#tl_doc *{visibility:visible} #tl_doc{display:block;position:absolute;left:0;top:0;width:100%} #tl_doc .card{border:none;box-shadow:none;padding:0} }
</style>

function simpanSekolah(){
  const v=id=>document.getElementById(id).value.trim();
  const angka=id=>{const x=v(id);return x===""?null:Math.max(0,parseInt(x,10)||0)};
  const idx=+v("s_idx");
  if(monRestricted()){
    const own=SEKOLAH.findIndex(s=>s.nama===currentUser.sekolah);
    if(own<0||idx!==own){toast("Anda hanya dapat mengubah data sekolah Anda.");return}
    SEKOLAH[own]=Object.assign({},SEKOLAH[own],{alamat:v("s_alamat"),murid:angka("s_murid"),guru:angka("s_guru"),tu:angka("s_tu"),rombel:angka("s_rombel")});
    toast("Data sekolah Anda diperbarui.");
    go("sekolah");
    return;
  }
  if(role!=="pengawas"&&role!=="admin"){toast("Anda tidak memiliki akses untuk mengubah data sekolah.");return}
  const nama=v("s_nama"),npsn=v("s_npsn"),alamat=v("s_alamat");
  const data={nama,alamat,npsn,murid:angka("s_murid"),guru:angka("s_guru"),tu:angka("s_tu"),rombel:angka("s_rombel")};
  if(!nama||!npsn){toast("Nama dan NPSN wajib diisi.");return}
  if(SEKOLAH.some((s,i)=>s.npsn===npsn&&i!==idx)){toast("NPSN sudah terdaftar.");return}
  if(idx>=0){SEKOLAH[idx]=Object.assign({},SEKOLAH[idx],data);toast("Data sekolah diperbarui.")}
  else{SEKOLAH.push(data);toast("Sekolah baru ditambahkan.")}
  delIdx=-1;
  go("sekolah");
}
function editSekolah(i){
  const s=SEKOLAH[i];
  if(!s) return;
  if(!(role==="pengawas"||role==="admin"||(monRestricted()&&s.nama===currentUser.sekolah))) return;
  if(!(role==="pengawas"||role==="admin")){ go("sekolah"); window.scrollTo({top:0,behavior:"smooth"}); return; }
  document.getElementById("s_title").textContent="Ubah Data Sekolah";
  document.getElementById("s_nama").value=s.nama;
  document.getElementById("s_npsn").value=s.npsn;
  document.getElementById("s_alamat").value=s.alamat;
  document.getElementById("s_murid").value=s.murid??"";
  document.getElementById("s_guru").value=s.guru??"";
  document.getElementById("s_tu").value=s.tu??"";
  document.getElementById("s_rombel").value=s.rombel??"";
  document.getElementById("s_idx").value=i;
  window.scrollTo({top:0,behavior:"smooth"});
}
function resetSekolahForm(){
  document.getElementById("s_title").textContent="Tambah Sekolah Baru";
  ["s_nama","s_npsn","s_alamat","s_murid","s_guru","s_tu","s_rombel"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("s_idx").value=-1;

function hapusSekolah(i){
  if(delIdx!==i){delIdx=i;go("sekolah");toast("Klik Konfirmasi untuk menghapus.");return}
  const nama=SEKOLAH[i].nama;

  go("sekolah");
  toast("Sekolah "+nama+" dihapus.");
}

function tambahBarisHadir(){
  const tr=document.createElement("tr");
  tr.innerHTML='<td class="h_no"></td><td><input class="h_nama"></td><td><input class="h_jab"></td><td><button class="btn ghost sm" type="button" onclick="hapusBarisHadir(this)">Hapus</button></td>';
  document.getElementById("h_body").appendChild(tr);

}
function hapusBarisHadir(btn){ btn.closest("tr").remove(); renomorHadir(); }
function renomorHadir(){ [...document.querySelectorAll("#h_body tr")].forEach((tr,i)=>{tr.querySelector(".h_no").textContent=i+1}); }
function ambilHadir(){
  return [...document.querySelectorAll("#h_body tr")].map(tr=>({nama:tr.querySelector(".h_nama").value.trim(),jabatan:tr.querySelector(".h_jab").value.trim()})).filter(x=>x.nama||x.jabatan);
}
function saveForm(){
  if(!bisaUbahMon()){toast("Anda tidak memiliki akses untuk mengisi monitoring.");return}
  const v=id=>document.getElementById(id).value.trim();
  if(!v("f_hasil")){toast("Isi hasil monitoring terlebih dahulu.");return}
  const file=document.getElementById("f_dok").files[0];
  if(file&&file.size>1000000){toast("Ukuran bukti maksimal 1 MB.");return}
  const base={sekolah:v("f_sekolah"),tgl:v("f_tgl"),periode:v("f_periode"),jenis:v("f_jenis"),area:v("f_area"),
    hasil:v("f_hasil"),status:v("f_status"),rekom:v("f_rekom"),
    pj:v("f_pj"),target:v("f_target"),progres:Math.min(100,Math.max(0,+v("f_progres")||0)),verif:v("f_verif")||"Belum Diverifikasi",
    hadir:ambilHadir(),link:v("f_link")};
  const simpan=(extra)=>{
    const data=Object.assign({},base,extra);
    if(monEditId===null){
      monitoring.push(Object.assign({id:++tindakNext,dok:"",dokData:""},data));
      toast("Monitoring tersimpan.");
    } else {
      const x=monitoring.find(m=>m.id===monEditId);
      if(!monBolehLihat(x)){toast("Data monitoring tidak ditemukan.");return}
      Object.assign(x,data);
      toast("Monitoring diperbarui.");
    }
    monEditId=null;
    go("monitor");
  };
  if(file){
    const r=new FileReader();
    r.onload=()=>simpan({dok:file.name,dokData:r.result});
    r.readAsDataURL(file);
  } else simpan({});
}
function editMon(id){
  if(!bisaUbahMon()||!monBolehLihat(monitoring.find(m=>m.id===id))) return;
  monEditId=id; monDelId=null;
  go("form");
  window.scrollTo({top:0,behavior:"smooth"});
}
function batalMon(){ monEditId=null; go("monitor"); }
function hapusMon(id){
  if(!bisaUbahMon()||!monBolehLihat(monitoring.find(m=>m.id===id))) return;
  if(monDelId!==id){monDelId=id;go("monitor");toast("Klik Konfirmasi untuk menghapus monitoring.");return}
  monitoring=monitoring.filter(m=>m.id!==id);

}

  ${rows.map(r=>r.src==="mon"?monRowTL(r):tlxRowTL(r)).join("")}</table></div>`:'<div class="empty">Belum ada tindak lanjut.</div>'}</div>`;

function simpanTLX(){

  if(!data.sekolah||(!data.rekom&&!data.tl)){toast("Sekolah dan rekomendasi atau tindak lanjut wajib diisi.");return}

  else { const x=TLX.find(t=>t.id===tlxEditId); if(x) Object.assign(x,data); toast("Tindak lanjut diperbarui."); }

async function unduhTLExcel(){
  let dl=null;
  try{ if(window.claude&&window.claude.use) dl=await window.claude.use("downloads"); }catch(e){ dl=null; }
  
  try{
    const XL=await loadXlsx();
    const rows=[["No","Sekolah","Asal / Monitoring","Rekomendasi","Tindak Lanjut Pengawas","Penanggung Jawab","Target","Progres (%)","Status TL","Verifikasi"]]
      .concat(tlRowsCetak().map((r,i)=>[i+1,r.sekolah,r.asal,r.rekom,r.tl,r.pj,r.target,r.progres,r.status,r.verif]));
    const wb=XL.utils.book_new();
    XL.utils.book_append_sheet(wb,aoaLebar(XL,rows),"Tindak Lanjut");
    const buf=XL.write(wb,{bookType:"xlsx",type:"array"});
    await simpanFile("Tindak_Lanjut_"+new Date().toISOString().slice(0,10)+".xlsx",new Uint8Array(buf));
    toast("Excel berhasil diunduh.");
  }catch(e){
    toast(e&&e.code==="declined"?"Unduhan dibatalkan.":(e&&e.message?"Gagal membuat Excel: "+e.message:"Unduhan tidak tersedia."));
  }
}

  editUserId=id; delUserId=null;
  go("akun");

}

function simpanAkun(){
  const v=id=>document.getElementById(id).value.trim();
  const nama=v("u_nama"), user=v("u_user"), pass=v("u_pass");
  const peran=document.getElementById("u_peran").value, sekolah=v("u_sekolah")||"-";
  if(!nama||!user){toast("Nama dan username wajib diisi.");return}
  if(USERS.some(u=>u.username===user&&u.id!==editUserId)){toast("Username sudah digunakan.");return}
  if(editUserId===null){
    if(pass.length<6){toast("Password minimal 6 karakter.");return}
    USERS.push({id:++userNext,nama,username:user,password:pass,peran,sekolah,aktif:true});
    toast("Akun ditambahkan.");
  } else {
    const u=USERS.find(x=>x.id===editUserId);
    if(pass&&pass.length<6){toast("Password minimal 6 karakter.");return}
    if(currentUser&&u.id===currentUser.id&&peran!==u.peran){toast("Peran akun yang sedang digunakan tidak dapat diubah.");return}
    Object.assign(u,{nama,username:user,peran,sekolah});
    if(pass) u.password=pass;
    if(currentUser&&u.id===currentUser.id){
      document.getElementById("hName").textContent=nama;
      document.getElementById("sName").textContent=nama;
    }
    toast("Akun diperbarui.");
  }
  editUserId=null;
  go("akun");
}
function hapusAkun(id){
  const u=USERS.find(x=>x.id===id);
  if(currentUser&&u.id===currentUser.id){toast("Akun yang sedang digunakan tidak dapat dihapus.");return}
  if(delUserId!==id){delUserId=id;go("akun");toast("Klik Konfirmasi untuk menghapus.");return}
  USERS=USERS.filter(x=>x.id!==id);
  if(editUserId===id) editUserId=null;
  delUserId=null;
  go("akun");
  toast("Akun "+u.username+" dihapus.");
}
function toggleUser(id){
  const u=USERS.find(x=>x.id===id);
  if(currentUser&&u.id===currentUser.id){toast("Akun yang sedang digunakan tidak dapat dinonaktifkan.");return}
  u.aktif=!u.aktif;

function unggahGambar(input,jenis,i){
  const f=input.files[0];
  if(!f) return;
  if(f.size>1000000){toast("Ukuran file maksimal 1 MB.");input.value="";return}
  const r=new FileReader();
  r.onload=()=>{
    SEKOLAH[i].profil=Object.assign({},SEKOLAH[i].profil||{},{[jenis]:r.result});
    toast((jenis==="logo"?"Logo":"Foto")+" sekolah diunggah.");
    go("profil");
  };
  r.readAsDataURL(f);
}

  const p=Object.assign({},SEKOLAH[i].profil||{});

  SEKOLAH[i].profil=p;

  go("profil");
}

  s.profil=Object.assign({},s.profil||{},{jenjang:v("pf_jenjang"),status:v("pf_status"),akreditasi:v("pf_akred"),kepsek:v("pf_kepsek"),telp:v("pf_telp"),email:v("pf_email"),web:v("pf_web")});
  if(lama!==nama){
    monitoring.forEach(m=>{if(m.sekolah===lama)m.sekolah=nama});

  delProfilIdx=null;

  go("profil");

function pilihProfilUser(v){ profilUserId=+v; delProfilUserId=null; go("profilsaya"); }
function unggahFotoUser(input,id){
  const f=input.files[0];
  if(!f) return;
  if(f.size>1000000){toast("Ukuran file maksimal 1 MB.");input.value="";return}
  const r=new FileReader();
  r.onload=()=>{
    const u=USERS.find(x=>x.id===id);
    u.profil=Object.assign({},u.profil||{},{foto:r.result});
    toast("Foto profil diunggah.");
    go("profilsaya");
  };
  r.readAsDataURL(f);
}
function hapusFotoUser(id){
  const u=USERS.find(x=>x.id===id);
  const p=Object.assign({},u.profil||{});
  delete p.foto;
  u.profil=p;
  toast("Foto profil dihapus.");
  go("profilsaya");
}
function simpanProfilUser(id){
  const v=k=>document.getElementById(k).value.trim();
  const nama=v("pu_nama");
  if(!nama){toast("Nama lengkap wajib diisi.");return}
  const u=USERS.find(x=>x.id===id);
  u.nama=nama;
  u.profil=Object.assign({},u.profil||{},{jabatan:v("pu_jabatan"),nip:v("pu_nip"),telp:v("pu_telp"),email:v("pu_email"),alamat:v("pu_alamat")});
  if(currentUser&&currentUser.id===id){
    document.getElementById("hName").textContent=nama;
    document.getElementById("sName").textContent=nama;
  }
  delProfilUserId=null;
  toast("Profil disimpan.");
  go("profilsaya");
}
function hapusDataProfilUser(id){
  if(delProfilUserId!==id){delProfilUserId=id;go("profilsaya");toast("Klik Konfirmasi Hapus Data untuk melanjutkan.");return}
  const u=USERS.find(x=>x.id===id);
  u.profil={};
  delProfilUserId=null;
  toast("Data profil dihapus.");
  go("profilsaya");
}

let resetHasil=null;
function buatPassword(){
  const c="abcdefghjkmnpqrstuvwxyz23456789";
  const a=new Uint32Array(8); crypto.getRandomValues(a);
  return Array.from(a,x=>c[x%c.length]).join("");
}

  if(!lama||!baru||!ulang){toast("Semua kolom wajib diisi.");return}
  if(currentUser.password!==lama){toast("Password lama tidak sesuai.");return}

  const data={sekolah,tgl:v("k_tgl"),mode:v("k_mode"),guruTotal:n("k_gtot"),guruMelaksanakan:n("k_gmel"),kelasTotal:n("k_ktot"),kelasMelaksanakan:n("k_kmel"),murid:n("k_murid"),totalMurid:n("k_total"),platform:v("k_platform"),kendala:v("k_kendala"),dok:v("k_dok")};
  if(bisaPantauKbm()){ data.catatan=v("k_catatan"); data.status=v("k_status"); }
  if(!sekolah||!data.tgl){toast("Sekolah dan tanggal wajib diisi.");return}
  if(data.guruTotal==null||data.guruMelaksanakan==null){toast("Isi jumlah guru dan jumlah guru yang sudah melaksanakan.");return}
  if(data.guruMelaksanakan>data.guruTotal||(data.kelasTotal!=null&&data.kelasMelaksanakan!=null&&data.kelasMelaksanakan>data.kelasTotal)){toast("Jumlah yang sudah melaksanakan tidak boleh melebihi total.");return}
  if(kbmEditId===null){
    if(KBM.some(x=>x.sekolah===sekolah&&x.tgl===data.tgl)){toast("Rekap sekolah ini untuk tanggal tersebut sudah ada. Gunakan Ubah.");return}
    KBM.push(Object.assign({id:++kbmNext,status:"Belum Dipantau",catatan:""},data));
    toast("Rekap harian ditambahkan.");
  } else {
    const x=KBM.find(m=>m.id===kbmEditId);
    if(!x||!bisaTulisKbm(x.sekolah)){toast("Anda tidak memiliki akses untuk mengubah rekap ini.");return}
    if(KBM.some(m=>m.id!==x.id&&m.sekolah===sekolah&&m.tgl===data.tgl)){toast("Rekap sekolah ini untuk tanggal tersebut sudah ada.");return}
    Object.assign(x,data);
    toast("Rekap harian diperbarui.");
  }
  kbmEditId=null;
  kbmTgl=data.tgl;
  go("kbm");
}

let LAP=[], lapNext=0, lapEditId=null, lapDelId=null, lapAktif=null, lapCetakReq=false;
const LAP_JENIS=["Harian","Mingguan","Bulanan","Tri Semester","Semester","Tahunan"];
const ROMAWI={1:"I",2:"II",3:"III"};
function lapRestricted(){ return role==="kepsek"||role==="operator"; }
function bisaTulisLap(sek){ return role==="pengawas"||role==="admin"||(lapRestricted()&&sek===currentUser.sekolah); }
function fmtTgl(d){ const p=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function tglID(d){ return d.toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"}); }
function bulanLabel(b){ if(!b) return "-"; const [y,m]=b.split("-"); return new Date(+y,+m-1,1).toLocaleDateString("id-ID",{month:"long",year:"numeric"}); }
function hitungPeriode(jenis,v){
  if(jenis==="Harian"){
    const d=new Date(v.tgl+"T00:00:00"); if(isNaN(d)) return null;
    const t=fmtTgl(d);
    return {mulai:t,selesai:t,label:"Harian: "+tglID(d)};
  }
  if(jenis==="Mingguan"){
    const d=new Date(v.tgl+"T00:00:00"); if(isNaN(d)) return null;
    const sen=new Date(d); sen.setDate(d.getDate()-((d.getDay()+6)%7));
    const min=new Date(sen); min.setDate(sen.getDate()+6);
    return {mulai:fmtTgl(sen),selesai:fmtTgl(min),label:"Mingguan: "+tglID(sen)+" s.d. "+tglID(min)};
  }
  if(jenis==="Bulanan"){
    if(!v.bulan) return null;
    const [y,m]=v.bulan.split("-").map(Number);
    return {mulai:v.bulan+"-01",selesai:fmtTgl(new Date(y,m,0)),label:"Bulanan: "+bulanLabel(v.bulan)};
  }
  if(jenis==="Tri Semester"){
    if(!v.tahun||!v.nomor) return null;
    const r={1:["01-01","04-30"],2:["05-01","08-31"],3:["09-01","12-31"]}[v.nomor];
    return {mulai:v.tahun+"-"+r[0],selesai:v.tahun+"-"+r[1],label:"Tri Semester "+ROMAWI[v.nomor]+" "+v.tahun};
  }
  if(jenis==="Semester"){
    if(!v.tahun||!v.nomor) return null;
    const r=v.nomor===1?["01-01","06-30"]:["07-01","12-31"];
    return {mulai:v.tahun+"-"+r[0],selesai:v.tahun+"-"+r[1],label:"Semester "+ROMAWI[v.nomor]+" "+v.tahun};
  }
  if(jenis==="Tahunan"){
    if(!v.tahun) return null;
    return {mulai:v.tahun+"-01-01",selesai:v.tahun+"-12-31",label:"Tahunan "+v.tahun};
  }
  return null;
}
function lapRange(l){ return l.mulai?{mulai:l.mulai,selesai:l.selesai,label:l.label||""}:hitungPeriode("Bulanan",{bulan:l.bulan}); }
function lapRekap(l){ const r=lapRange(l); return KBM.filter(x=>x.sekolah===l.sekolah&&x.tgl>=r.mulai&&x.tgl<=r.selesai).sort((a,b)=>a.tgl<b.tgl?-1:1); }
function lapRingkas(rows){
  const hari=rows.length;
  const sudah=rows.filter(r=>statusLaksana(r)==="Sudah Melaksanakan").length;
  const sebagian=rows.filter(r=>statusLaksana(r)==="Sebagian Melaksanakan").length;
  const belum=rows.filter(r=>statusLaksana(r)==="Belum Melaksanakan").length;
  const gt=rows.reduce((a,r)=>a+(Number(r.guruTotal)||0),0), gm=rows.reduce((a,r)=>a+(Number(r.guruMelaksanakan)||0),0);
  const kt=rows.reduce((a,r)=>a+(Number(r.kelasTotal)||0),0), km=rows.reduce((a,r)=>a+(Number(r.kelasMelaksanakan)||0),0);
  const mt=rows.reduce((a,r)=>a+(Number(r.totalMurid)||0),0), mh=rows.reduce((a,r)=>a+(Number(r.murid)||0),0);
  const pct=(a,b)=>b?Math.round(a/b*100)+"%":"-";
  return {hari,sudah,sebagian,belum,guru:pct(gm,gt),kelas:pct(km,kt),murid:pct(mh,mt),
    mode:{"Tatap Muka":rows.filter(r=>r.mode==="Tatap Muka").length,"PJJ":rows.filter(r=>r.mode==="PJJ").length,"Campuran":rows.filter(r=>r.mode==="Campuran").length},
    kendala:rows.filter(r=>r.kendala).map(r=>r.tgl+": "+r.kendala)};
}
function bulanDari(e){ if(e.mulai) return e.mulai.slice(0,7); if(e.bulan) return e.bulan; return new Date().toISOString().slice(0,7); }

  if(jenis==="Harian") return '<label>Tanggal</label><input type="date" id="l_pm" value="'+(e.mulai||fmtTgl(new Date()))+'">';

function simpanLap(){
  const v=id=>{const e=document.getElementById(id);return e?e.value.trim():""};
  const sekolah=lapRestricted()?currentUser.sekolah:v("l_sekolah");
  const periode=bacaPeriode();
  if(!sekolah||!periode||!v("l_wakil")){toast("Sekolah, periode, dan nama Wakil Kepala Sekolah wajib diisi.");return}
  const jenis=v("l_jenis");
  if(LAP.some(x=>x.id!==lapEditId&&x.sekolah===sekolah&&(x.jenis||"Bulanan")===jenis&&lapRange(x).mulai===periode.mulai)){toast("Laporan untuk sekolah dan periode ini sudah ada.");return}
  const file=document.getElementById("l_dok").files[0];
  if(file&&file.size>1000000){toast("Ukuran bukti dukung maksimal 1 MB.");return}
  const base={sekolah,jenis,mulai:periode.mulai,selesai:periode.selesai,label:periode.label,bulan:periode.mulai.slice(0,7),wakil:v("l_wakil"),kepsek:v("l_kepsek"),pengawas:v("l_pengawas"),tglTtd:v("l_tgl"),catatan:v("l_catatan"),link:v("l_link")};
  const simpan=extra=>{
    const data=Object.assign({},base,extra);
    if(lapEditId===null){
      LAP.push(Object.assign({id:++lapNext,dok:"",dokData:""},data));
      toast("Laporan KBM & PJJ ditambahkan.");
    } else {
      const x=LAP.find(m=>m.id===lapEditId);
      if(!x||!bisaTulisLap(x.sekolah)){toast("Anda tidak memiliki akses untuk mengubah laporan ini.");return}
      Object.assign(x,data);
      toast("Laporan KBM & PJJ diperbarui.");
    }
    lapEditId=null; lapAktif=null; go("laporanKbm");
  };
  if(file){
    const r=new FileReader();
    r.onload=()=>simpan({dok:file.name,dokData:r.result});
    r.readAsDataURL(file);
  } else simpan({});
}

function hapusLap(id){
  const x=LAP.find(m=>m.id===id);

function loadXlsx(){
  return new Promise((res,rej)=>{
    if(window.XLSX) return res(window.XLSX);
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
    s.onload=()=>window.XLSX?res(window.XLSX):rej(new Error("XLSX tidak tersedia"));
    s.onerror=()=>rej(new Error("gagal memuat pustaka Excel"));
    document.head.appendChild(s);
  });
}

const SKRIP_PDF={};
function muatSkrip(url){
  if(SKRIP_PDF[url]) return SKRIP_PDF[url];
  SKRIP_PDF[url]=new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src=url; s.onload=res; s.onerror=()=>rej(new Error("gagal memuat pustaka PDF"));
    document.head.appendChild(s);
  });
  return SKRIP_PDF[url];
}
function cssPdf(){
  const p="#pdf_wrap ";
  return '<style>'
    +p+'{font-family:Arial,Helvetica,sans-serif;color:#1f2937;font-size:12px;line-height:1.4;}'
    +p+'.card{background:#fff;border:none;box-shadow:none;padding:0;margin:0;}'
    +p+'.sec-t{margin:14px 0 6px;font-size:13px;color:#1f2937;border-left:4px solid #5b4be8;padding-left:8px;page-break-after:avoid;}'
    +p+'table.pf{border-collapse:collapse;width:100%;table-layout:fixed;font-size:10px;margin-bottom:10px;}'
    +p+'table.pf th,'+p+'table.pf td{border:1px solid #9ca3af;padding:4px 5px;text-align:left;vertical-align:top;word-break:break-word;overflow-wrap:anywhere;}'
    +p+'table.pf th{background:#e5e7eb;font-weight:700;}'
    +p+'tr{page-break-inside:avoid;}'
    +p+'.empty{color:#6b7280;font-size:11px;padding:6px 0;}'
    +'</style>';
}
async function unduhPdf(html,nama){
  const wrap=document.createElement("div");
  wrap.id="pdf_wrap";
  wrap.style.cssText="position:absolute;left:0;top:0;width:1123px;background:#fff;padding:0;z-index:2147483646;";
  wrap.innerHTML=cssPdf()+html;
  document.body.appendChild(wrap);
  try{
    await Promise.all([...wrap.querySelectorAll("img")].map(im=>im.complete&&im.naturalWidth>0?Promise.resolve():new Promise(r=>{im.onload=r;im.onerror=r;})));
    window.scrollTo(0,0);
    await muatSkrip("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
    await muatSkrip("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
    const lebar=Math.max(1123,wrap.scrollWidth);
    const canvas=await html2canvas(wrap,{scale:2,useCORS:true,backgroundColor:"#ffffff",width:lebar,windowWidth:lebar,logging:false,scrollX:0,scrollY:0});
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF({orientation:"landscape",unit:"pt",format:"a4"});
    const halamanW=842-72, halamanH=595-72;
    const pxPerPt=canvas.width/halamanW;
    const irisH=Math.floor(halamanH*pxPerPt);
    let y=0, pertama=true;
    while(y<canvas.height){
      const tinggi=Math.min(irisH,canvas.height-y);
      const potong=document.createElement("canvas");
      potong.width=canvas.width; potong.height=tinggi;
      potong.getContext("2d").drawImage(canvas,0,y,canvas.width,tinggi,0,0,canvas.width,tinggi);
      if(!pertama) doc.addPage();
      pertama=false;
      doc.addImage(potong.toDataURL("image/jpeg",0.92),"JPEG",36,36,halamanW,tinggi/pxPerPt);
      y+=tinggi;
    }
    const buf=doc.output("arraybuffer");
    await simpanFile(nama.replace(/[^A-Za-z0-9_\-]+/g,"_")+".pdf",new Uint8Array(buf));
    toast("PDF berhasil diunduh.");
  }catch(e){
    toast("Gagal membuat PDF: "+(e&&e.message?e.message:"tidak diketahui"));
  }finally{
    wrap.remove();
  }
}

async function simpanFile(nama,data){
  let dl=null;
  try{ if(window.claude&&window.claude.use) dl=await window.claude.use("downloads"); }catch(e){ dl=null; }
  if(dl){ await dl.save({filename:nama,data:data}); return true; }
  const mime=/\.pdf$/i.test(nama)?"application/pdf":/\.xlsx$/i.test(nama)?"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":/\.html$/i.test(nama)?"text/html;charset=utf-8":"application/octet-stream";
  const blob=new Blob([data],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=nama; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  return true;
}
function aoaLebar(XL,rows){
  const ws=XL.utils.aoa_to_sheet(rows);
  const jumlah=Math.max(0,...rows.map(r=>r.length));
  ws["!cols"]=Array.from({length:jumlah},(_,c)=>{
    const lebar=Math.max(...rows.map(r=>String(r[c]==null?"":r[c]).length));
    return {wch:Math.min(60,Math.max(10,lebar+2))};
  });
  return ws;
}

function simpanHakMenu(){
  const hasil={};
  for(const r of RNAMES){
    const chk=k=>{const el=document.getElementById("hm_"+r+"_"+k);return !!(el&&el.checked)};
    let keys=ROLES[r].menu.filter(chk).concat(ALL_MENU.filter(k=>chk(k)&&!ROLES[r].menu.includes(k)));
    if(r==="admin"){["akun","pengaturan","resetpw"].forEach(k=>{if(!keys.includes(k))keys.push(k)});}
    if(!keys.length){toast("Setiap peran harus memiliki minimal satu menu.");return}
    hasil[r]=keys;

    :'<div class="empty">Tidak ada tindak lanjut yang terbuka.</div>');
  const ttd=(jab,nama,nip)=>'<div style="text-align:center;font-size:13px;min-height:150px"><div>'+jab+'</div><div style="height:64px"></div>'
    +'<div style="font-weight:700">'+(nama?esc(nama):'( ........................................ )')+'</div><div>NIP. '+(nip?esc(nip):'..........................')+'</div></div>';
  const tandaTangan='<h4 class="sec-t">G. Pengesahan</h4><div style="text-align:right;font-size:13px">Samarinda, '+tgl+'</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px">'
    +ttd("Mengetahui,<br>Kepala Dinas Pendidikan<br>Provinsi Kalimantan Timur",SETTINGS.kadis,"")
    +ttd("Mengetahui,<br>Kepala Bidang SMA",SETTINGS.kabid,"")

    +ttd("Dibuat oleh,<br>Pengawas Sekolah",SETTINGS.pengawas,"")
    +'</div>';
  box.innerHTML='<div class="card" style="background:#fff">'+kop+identitas+ringkas+rekap+rincian+hadirBlok+tindak+tandaTangan+'</div>';

const SB_URL="https://kzltulyyqqhlddojrnar.supabase.co";
const SB_KEY="sb_publishable_tRuFovi1KUfUxkxaOeVK2Q_7MgnhjKp";
const SB_TABLE="simonika_state";
const SB_ROW="main";
let sbReady=false, sbTimer=null;
const SB_HDR={"apikey":SB_KEY,"Content-Type":"application/json"};
if(SB_KEY.startsWith("eyJ")) SB_HDR.Authorization="Bearer "+SB_KEY;
function setStatus(t){ const el=document.getElementById("sb_status"); if(el) el.textContent=t; }
function kumpulState(){
  return {
    USERS:USERS, SEKOLAH:SEKOLAH, monitoring:monitoring, PESAN:PESAN, JENIS:JENIS, SETTINGS:SETTINGS,
    KBM:KBM, LAP:LAP, TLX:TLX,
    hakMenu:Object.fromEntries(RNAMES.map(r=>[r,ROLES[r].menu])),
    counters:{userNext:userNext,tindakNext:tindakNext,kbmNext:kbmNext,lapNext:lapNext,tlxNext:tlxNext}
  };
}
function terapkanState(s){
  if(!s) return;
  if(s.USERS&&s.USERS.length) USERS=s.USERS;
  if(s.SEKOLAH){ SEKOLAH.length=0; s.SEKOLAH.forEach(x=>SEKOLAH.push(x)); }
  if(s.monitoring) monitoring=s.monitoring;
  if(s.PESAN) PESAN=s.PESAN;
  if(s.JENIS) JENIS=s.JENIS;
  if(s.SETTINGS) SETTINGS=Object.assign({},SETTINGS,s.SETTINGS);
  if(s.KBM) KBM=s.KBM;
  if(s.LAP) LAP=s.LAP;
  if(s.TLX) TLX=s.TLX;
  if(s.hakMenu) RNAMES.forEach(r=>{ if(s.hakMenu[r]&&s.hakMenu[r].length) ROLES[r].menu=s.hakMenu[r]; });
  const c=s.counters||{};
  userNext=Math.max(c.userNext||0,...USERS.map(u=>u.id||0),0);
  tindakNext=Math.max(c.tindakNext||0,...monitoring.map(m=>m.id||0),0);
  kbmNext=Math.max(c.kbmNext||0,...KBM.map(x=>x.id||0),0);
  lapNext=Math.max(c.lapNext||0,...LAP.map(x=>x.id||0),0);
  tlxNext=Math.max(c.tlxNext||0,...TLX.map(x=>x.id||0),0);
}
const LS_KEY="simonika_data_v1";
function simpanLokal(){ try{ localStorage.setItem(LS_KEY,JSON.stringify(kumpulState())); }catch(e){} }
const SESI_KEY="simonika_sesi_v1";
function pulihSesi(){
  if(currentUser) return;
  let t=null; try{ t=localStorage.getItem(SESI_KEY); }catch(e){}
  if(!t) return;
  try{
    const {username}=JSON.parse(t);
    const acc=USERS.find(x=>x.username===username&&x.aktif);
    if(acc) masukSebagai(acc);
  }catch(e){}
}
function muatLokal(){ try{ const t=localStorage.getItem(LS_KEY); if(t) terapkanState(JSON.parse(t)); }catch(e){} }
async function sbAmbil(){
  const r=await fetch(SB_URL+"/rest/v1/"+SB_TABLE+"?id=eq."+SB_ROW+"&select=data",{headers:SB_HDR});
  if(!r.ok) throw new Error("GET "+r.status);
  const rows=await r.json();
  return rows.length?rows[0].data:null;
}
async function sbSimpan(){
  const body=[{id:SB_ROW,data:kumpulState(),updated_at:new Date().toISOString()}];
  const r=await fetch(SB_URL+"/rest/v1/"+SB_TABLE+"?on_conflict=id",{method:"POST",
    headers:Object.assign({},SB_HDR,{"Prefer":"resolution=merge-duplicates"}),body:JSON.stringify(body)});
  if(!r.ok) throw new Error("POST "+r.status);
}
function jadwalSimpan(){
  if(!sbReady) return;
  clearTimeout(sbTimer);
  sbTimer=setTimeout(()=>{
    setStatus("Menyimpan...");
    sbSimpan().then(()=>setStatus("Tersimpan di Supabase")).catch(e=>setStatus("Gagal menyimpan: "+e.message));
  },400);
}
const _goAsli=go;
go=function(k,arg){ _goAsli(k,arg); simpanLokal(); jadwalSimpan(); };
async function syncMulai(){
  if(SB_KEY.startsWith("GANTI")){ setStatus("Belum terhubung: isi SB_KEY di dalam berkas"); return; }
  setStatus("Memuat data...");
  try{
    const s=await sbAmbil();
    if(s) terapkanState(s); else muatLokal();
    sbReady=true;
    setStatus(s?"Terhubung ke Supabase":"Terhubung. Data awal disimpan.");
    if(!s) await sbSimpan();
  }catch(e){
    setStatus("Tidak terhubung ke Supabase: "+e.message);
  }
}
syncMulai().then(pulihSesi,pulihSesi);
